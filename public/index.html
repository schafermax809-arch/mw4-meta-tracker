<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b0c" />
    <meta
      name="description"
      content="Dein MW4-Arsenal: Gunsmith, Camo-Challenges und privater Fortschritt in einem Menü."
    />
    <title>MW4 Intel · Waffen & Gunsmith</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="workshop-environment" aria-hidden="true"></div>
    <header class="gamebar">
      <div class="mode-heading">
        <button
          id="global-back"
          class="back-control"
          aria-label="Zurück zur Waffenübersicht"
        >
          ‹</button
        ><a href="#/arsenal" class="mode-name"
          >MULTIPLAYER<span>MW4 <b>INTEL</b></span></a
        >
      </div>
      <nav class="primary-nav" aria-label="Hauptmenü">
        <a href="#/arsenal" data-section="arsenal">Waffen</a
        ><a href="#/tierlist" data-section="tierlist">Tierlist</a
        ><a href="#/planner" data-section="planner">Grind Planner</a
        ><a href="#/intel" data-section="intel">Intel & Daten</a>
      </nav>
      <div class="player-status">
        <i class="status-light"></i><span>LOKAL GESPEICHERT</span
        ><button id="quick-favorites" aria-label="Favoriten anzeigen">
          ☆ <span id="favorite-count">0</span>
        </button>
      </div>
    </header>
    <main id="screen" tabindex="-1">
      <div class="loading-state">
        <span class="loading-reticle"></span>ARSENAL WIRD GELADEN
      </div>
    </main>
    <footer class="inputbar">
      <div class="input-hints">
        <button id="footer-back"><kbd>ESC</kbd> ZURÜCK</button
        ><span><kbd>↑ ↓ ← →</kbd> NAVIGIEREN</span
        ><span><kbd>ENTER</kbd> AUSWÄHLEN</span><span><kbd>F</kbd> FAVORIT</span
        ><button id="search-shortcut"><kbd>/</kbd> SUCHE</button>
      </div>
      <a id="data-status" href="#/intel"
        >DATEN WERDEN GELADEN <span>↗</span></a
      >
    </footer>
    <dialog
      id="attachment-dialog"
      class="side-dialog"
      aria-labelledby="attachment-title"
    >
      <div class="dialog-heading">
        <div>
          <div class="eyebrow">GUNSMITH / AUFSÄTZE</div>
          <h2 id="attachment-title">AUFSATZ WÄHLEN</h2>
        </div>
        <button
          class="icon-button"
          data-close="attachment-dialog"
          aria-label="Aufsatzauswahl schließen"
        >
          ×
        </button>
      </div>
      <div id="attachment-content"></div>
    </dialog>
    <dialog
      id="build-dialog"
      class="build-dialog"
      aria-labelledby="build-dialog-title"
    >
      <div class="dialog-heading">
        <h2 id="build-dialog-title">BUILD</h2>
        <button
          class="icon-button"
          data-close="build-dialog"
          aria-label="Buildansicht schließen"
        >
          ×
        </button>
      </div>
      <div id="build-dialog-content"></div>
    </dialog>
    <input
      type="file"
      id="import-progress"
      accept="application/json,.json"
      hidden
    /><input
      type="file"
      id="import-build"
      accept="application/json,.json"
      hidden
    />
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
